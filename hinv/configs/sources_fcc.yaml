# Sources of the runs at FCC, one per process; each holds all polarisations of the process.
# path is not read with --skip-integrity-check, but is required and names the items.
- name: e2e2h
  path: $DATASET_ROOT/dataset_fcc_e2e2h
  root_files: ''
  event_categorization: { default: null, order: null, items: [ e2e2h ] }
  disabled: false
  reset: false

