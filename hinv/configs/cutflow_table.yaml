    label: '\HepProcess{\Pgm\Pgm}'
  - category: eemumu
    label: '\HepProcess{\Pe\Pe\Pgm\Pgm}'
  - category: zz_mumununu
    label: '\HepProcess{\Pgm\Pgm\Pgn\Pgn}'
  - category: e2e2h
    label: '\HepProcess{\Pgm\Pgm\PH}'
    is_signal: true
